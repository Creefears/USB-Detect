# Lint et vérification de compilation.
# Note : USB Detect est une application Windows (PyQt6 + pywin32 + wmi).
# La CI ne peut pas installer/exécuter ces dépendances sous Linux, donc on se
# limite à un lint des erreurs de syntaxe et à une compilation des sources.
# Le build de l'exécutable se fait dans build-release.yml (runner Windows).

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
    - name: Lint with flake8
      run: |
        # Échoue uniquement sur les erreurs de syntaxe ou les noms indéfinis
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Le reste est traité comme avertissements (n'échoue pas le build)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Compile sources
      run: python -m py_compile engine.py i18n.py main.py wizard.py build.py
